# ──────────────────────────────────────────────────────────────────────────────
#  PlayTorrioV3 — Multi-Platform CI/CD Release Builder
#  Builds:
#    - Windows: Installer (Inno Setup) & Portable ZIP (x64)
#    - Android: Split-per-ABI APKs (arm64-v8a, armeabi-v7a) — ARM devices only
#    - Linux: AppImage & Tar.gz (x86_64)
#    - macOS: Apple Silicon (ARM64) & Intel (x64) DMG & ZIP
#    - iOS: Sideloadable IPA (no-codesign)
#  Trigger: Git tag push (v*) or Manual Workflow Dispatch
#  Environment: Injects --dart-define-from-file=.env using ${{ secrets.ENV_FILE }}
# ──────────────────────────────────────────────────────────────────────────────
name: Build and Release PlayTorrioV3

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ─── Windows Build ────────────────────────────────────────────────────────
  windows:
    name: Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release --dart-define-from-file=.env --split-debug-info=build/symbols

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "PATH refreshed for Inno Setup."

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cleanVersion = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($cleanVersion)) { $cleanVersion = "1.1.5" }

          $isccCmd = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $isccCmd) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                $isccCmd = $candidate
                break
              }
            }
          }
          if (-not $isccCmd) {
            throw "ISCC compiler executable could not be found!"
          }
          Write-Host "Using Inno Setup Compiler at: $isccCmd"

          New-Item -ItemType Directory -Force -Path "installer\windows\Output"

          & $isccCmd /DMyAppVersion=$cleanVersion installer\windows\setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          if (Test-Path "installer\windows\Output\PlayTorrio-Windows-Setup.exe") {
            Copy-Item "installer\windows\Output\PlayTorrio-Windows-Setup.exe" ".\PlayTorrio-Windows-Setup.exe" -Force
            Write-Host "Verified and copied PlayTorrio-Windows-Setup.exe to root."
          } else {
            throw "PlayTorrio-Windows-Setup.exe was not found in Output directory after ISCC compile!"
          }

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PlayTorrio-Windows-x64-Portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-Windows
          path: |
            PlayTorrio-Windows-Setup.exe
            PlayTorrio-Windows-x64-Portable.zip

      - name: Upload Windows Symbols
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-Windows-symbols
          if-no-files-found: ignore
          path: build/symbols/**

  # ── Android Build (split-per-ABI APKs) ───────────────────────────────────
  android:
    name: Android (APK per ABI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Configure release signing
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
            printf 'storeFile=../upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.ANDROID_STORE_PASSWORD }}" \
              "${{ secrets.ANDROID_KEY_ALIAS }}" \
              "${{ secrets.ANDROID_KEY_PASSWORD }}" > android/key.properties
            echo "Release APKs will be signed with the provided keystore."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set — release APKs will be debug-signed."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --dart-define-from-file=.env --split-debug-info=build/symbols

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-Android
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload Android Symbols
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-Android-symbols
          if-no-files-found: ignore
          path: build/symbols/**

  # ─── Linux x64 Build (AppImage & Tar.gz) ───────────────────────────────────
  linux-x64:
    name: Linux x64 (AppImage & Tar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo grep -rl "dl.google.com" /etc/apt/ 2>/dev/null | xargs -r sudo rm -f
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -y || true
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev xvfb \
            libboost-all-dev libssl-dev libgcrypt20-dev

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Generate Linux platform files if missing
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release --dart-define-from-file=.env --split-debug-info=build/symbols

      - name: Package as AppImage & Tar
        run: |
          curl -fSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool
          chmod +x appimagetool

          APP=PlayTorrio.AppDir
          mkdir -p "$APP"
          cp -r build/linux/x64/release/bundle/* "$APP/"

          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png "$APP/PlayTorrio.png"
          elif [ -f "icon.png" ]; then
            cp icon.png "$APP/PlayTorrio.png"
          else
            touch "$APP/PlayTorrio.png"
          fi

          cat <<EOF > "$APP/PlayTorrio.desktop"
          [Desktop Entry]
          Name=PlayTorrio
          Exec=AppRun
          Icon=PlayTorrio
          Type=Application
          Categories=AudioVideo;Audio;Video;Player;
          EOF

          printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./playtorrio "$@"\n' > "$APP/AppRun"
          chmod +x "$APP/AppRun"

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APP" PlayTorrio-Linux-x86_64.AppImage
          tar -czvf PlayTorrio-Linux-x86_64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-Linux-x64
          path: |
            PlayTorrio-Linux-x86_64.AppImage
            PlayTorrio-Linux-x86_64.tar.gz

      - name: Upload Linux Symbols
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-Linux-symbols
          if-no-files-found: ignore
          path: build/symbols/**

  # ─── macOS ARM64 Build (Apple Silicon) ───────────────────────────────────
  macos-arm64:
    name: macOS (Apple Silicon ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Configure macOS platform files if missing
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release --dart-define-from-file=.env --split-debug-info=build/symbols

      - name: Package as DMG & ZIP
        run: |
          cd build/macos/Build/Products/Release
          mv playtorrio.app PlayTorrio.app

          codesign --sign - --force --deep PlayTorrio.app

          mkdir -p dmg_temp
          cp -R PlayTorrio.app dmg_temp/
          ln -s /Applications dmg_temp/Applications

          sync
          sleep 2

          for i in {1..3}; do
            hdiutil create -volname "PlayTorrio" -srcfolder dmg_temp -ov -format UDZO ../../../../../PlayTorrio-macOS-arm64.dmg && break || sleep 3
          done
          zip -ry ../../../../../PlayTorrio-macOS-arm64.zip PlayTorrio.app

      - name: Upload macOS ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-macOS-arm64
          path: |
            PlayTorrio-macOS-arm64.dmg
            PlayTorrio-macOS-arm64.zip

      - name: Upload macOS ARM64 Symbols
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-macOS-arm64-symbols
          if-no-files-found: ignore
          path: build/symbols/**

  # ─── macOS Intel Build (x86_64) ──────────────────────────────────────────
  macos-intel:
    name: macOS (Intel x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Setup Flutter x64
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: arch -x86_64 flutter pub get

      - name: Build macOS Intel Release
        run: arch -x86_64 flutter build macos --release --dart-define-from-file=.env --split-debug-info=build/symbols

      - name: Package as DMG & ZIP
        run: |
          cd build/macos/Build/Products/Release
          mv playtorrio.app PlayTorrio.app

          codesign --sign - --force --deep PlayTorrio.app

          mkdir -p dmg_temp
          cp -R PlayTorrio.app dmg_temp/
          ln -s /Applications dmg_temp/Applications

          sync
          sleep 2

          for i in {1..3}; do
            hdiutil create -volname "PlayTorrio" -srcfolder dmg_temp -ov -format UDZO ../../../../../PlayTorrio-macOS-intel.dmg && break || sleep 3
          done
          zip -ry ../../../../../PlayTorrio-macOS-intel.zip PlayTorrio.app

      - name: Upload macOS Intel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-macOS-intel
          path: |
            PlayTorrio-macOS-intel.dmg
            PlayTorrio-macOS-intel.zip

      - name: Upload macOS Intel Symbols
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-macOS-intel-symbols
          if-no-files-found: ignore
          path: build/symbols/**

  # ─── iOS Build (Sideloadable IPA — no-codesign) ───────────────────────────
  ios:
    name: iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env --split-debug-info=build/symbols

      - name: Package as IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -ry ../../../PlayTorrio-iOS.ipa Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-iOS
          path: PlayTorrio-iOS.ipa

      - name: Upload iOS Symbols
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-iOS-symbols
          if-no-files-found: ignore
          path: build/symbols/**

  # ─── Create / Publish GitHub Release ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [windows, android, linux-x64, macos-arm64, macos-intel, ios]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "PlayTorrio ${{ github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            *.exe
            *.zip
            *.apk
            *.AppImage
            *.tar.gz
            *.dmg
            *.ipa
