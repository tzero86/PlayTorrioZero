<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 176" role="img" aria-labelledby="zplay-signal-lockup-title">
  <title id="zplay-signal-lockup-title">ZPlay signal lockup</title>
  <!-- accent: #2FD0C0 (Signal Teal). Re-tint by replacing this one hex; every other
       shape inherits currentColor so the lockup works on dark and light surfaces. -->
  <g transform="translate(-0.193 -0.318) scale(1.340909)">
    <g fill="none" stroke-width="16" stroke-linejoin="miter" stroke-linecap="round">
      <path d="M28 28 H100" stroke="currentColor" />
      <path d="M28 100 H100" stroke="currentColor" />
      <path d="M100 28 V52 H76 V76 H52 V100" stroke="#2FD0C0" />
    </g>
  </g>
  <g transform="translate(178.625 36)" fill="none" stroke="currentColor" stroke-width="15"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 7.5 H48.5 L7.5 92.5 H48.5" />
    <path d="M83.5 92.5 V7.5 H106 A21.25 21.25 0 0 1 106 50 H83.5" />
    <path d="M160.25 7.5 V92.5" />
    <ellipse cx="224.25" cy="65" rx="23" ry="27.5" />
    <path d="M247.25 37.5 V92.5" />
    <path d="M286.25 37.5 L306.75 71.75" />
    <path d="M327.25 37.5 L286.25 106" />
  </g>
</svg>
