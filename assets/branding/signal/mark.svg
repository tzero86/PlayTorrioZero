<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="zplay-signal-title">
  <title id="zplay-signal-title">ZPlay signal mark</title>
  <!-- accent: #2FD0C0 (Signal Teal). Re-tint by replacing this one hex; all other
       shapes inherit currentColor so the mark works on dark and light surfaces. -->
  <g fill="none" stroke-width="16" stroke-linejoin="miter" stroke-linecap="round">
    <path d="M28 28 H100" stroke="currentColor" />
    <path d="M28 100 H100" stroke="currentColor" />
    <path d="M100 28 V52 H76 V76 H52 V100" stroke="#2FD0C0" />
  </g>
</svg>
