<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 176" role="img" aria-labelledby="zplay-orbital-lockup-title">
  <title id="zplay-orbital-lockup-title">ZPlay orbital lockup</title>
  <!-- accent: #2FD0C0 (Signal Teal). Re-tint by replacing this one hex; every other
       shape inherits currentColor so the lockup works on dark and light surfaces. -->
  <g transform="translate(13.042 10.917) scale(1.134114)">
    <ellipse cx="64" cy="64" rx="50" ry="36" transform="rotate(-40 64 64)"
             fill="none" stroke="#2FD0C0" stroke-width="16" />
    <!-- Core: a solid body caught mid-orbit. Deliberately not a play
         triangle - that glyph is the most generic mark in streaming, and the
         offset reads as motion rather than a static pause point. Sized (r=16,
         offset +5/-5) to keep the ring's ~10-unit clearance, so ring and core
         stay two separate shapes in a single colour. -->
    <circle cx="69" cy="59" r="16" fill="currentColor" />
  </g>
  <g transform="translate(179.357 36)" fill="none" stroke="currentColor" stroke-width="15"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 7.5 H48.5 L7.5 92.5 H48.5" />
    <path d="M83.5 92.5 V7.5 H106 A21.25 21.25 0 0 1 106 50 H83.5" />
    <path d="M160.25 7.5 V92.5" />
    <ellipse cx="224.25" cy="65" rx="23" ry="27.5" />
    <path d="M247.25 37.5 V92.5" />
    <path d="M286.25 37.5 L306.75 71.75" />
    <path d="M327.25 37.5 L286.25 106" />
  </g>
</svg>
