<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="zplay-orbital-title">
  <title id="zplay-orbital-title">ZPlay orbital mark</title>
  <!-- accent: #2FD0C0 (Signal Teal). Re-tint by replacing this one hex; all other
       shapes inherit currentColor so the mark works on dark and light surfaces.
       The orbit is one tilted ellipse (50x36, rotated -40) which clears the play
       core by ~10 units all round, so ring and core stay two separate shapes in a
       single colour and neither one dissolves into the other at small sizes. -->
  <ellipse cx="64" cy="64" rx="50" ry="36" transform="rotate(-40 64 64)"
           fill="none" stroke="#2FD0C0" stroke-width="16" />
    <!-- Core: a solid body caught mid-orbit. Deliberately not a play
         triangle - that glyph is the most generic mark in streaming, and the
         offset reads as motion rather than a static pause point. Sized (r=16,
         offset +5/-5) to keep the ring's ~10-unit clearance, so ring and core
         stay two separate shapes in a single colour. -->
    <circle cx="69" cy="59" r="16" fill="currentColor" />
</svg>
